    nrm[i * 4] = (nx * .5 + .5) * 255; nrm[i * 4 + 1] = (ny * .5 + .5) * 255; nrm[i * 4 + 2] = (nzv * .5 + .5) * 255; nrm[i * 4 + 3] = 255;
    const hn = clamp((h[i] - 0.43) / 0.5, 0, 1);

  for (let y = 0; y < Hh; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4, dx = h[(x + 1) % W] - h[(x - 1 + W) % W];
    let nx = -dx * 2.2, ny = (y < 5 ? -0.5 : y > Hh - 6 ? 0.5 : 0), nz = 1; const l = Math.hypot(nx, ny, nz);
    nrm[i] = (nx / l * .5 + .5) * 255; nrm[i + 1] = (ny / l * .5 + .5) * 255; nrm[i + 2] = (nz / l * .5 + .5) * 255; nrm[i + 3] = 255;

    col[i] = 210 * v; col[i + 1] = 207 * v; col[i + 2] = 200 * v; col[i + 3] = 255;
  }
  const mk = (d, srgb) => { const c = document.createElement('canvas'); c.width = W; c.height = Hh; c.getContext('2d').putImageData(new ImageData(d, W, Hh), 0, 0); const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; return t; };

/* ---------------------------------------------------------------- coin mesh */
const coin = new THREE.Group(); scene.add(coin);
const coinQ = new THREE.Quaternion(), coinP = new THREE.Vector3(0, H / 2, 0);
async function buildCoin() {
  try { await Promise.race([document.fonts.load(`700 50px ${F_FONT}`), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  const ob = makeFace(drawObverse), rv = makeFace(drawReverse), ed = makeEdge();
  const faceMat = t => new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 1, ...t, normalScale: new THREE.Vector2(1.1, 1.1) });
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.3, ...ed });
  const bevelMat = new THREE.MeshStandardMaterial({ color: 0xd2cfc8, metalness: 1, roughness: 0.24 });
  const SEG = 160;
  const side = new THREE.Mesh(new THREE.CylinderGeometry(R, R, H - 2 * BV, SEG, 1, true), edgeMat);
  const bTop = new THREE.Mesh(new THREE.CylinderGeometry(R - INS, R, BV, SEG, 1, true), bevelMat); bTop.position.y = H / 2 - BV / 2;
  const bBot = new THREE.Mesh(new THREE.CylinderGeometry(R, R - INS, BV, SEG, 1, true), bevelMat); bBot.position.y = -H / 2 + BV / 2;
  const top = new THREE.Mesh(new THREE.CircleGeometry(R - INS, SEG), faceMat(ob)); top.rotation.x = -Math.PI / 2; top.position.y = H / 2;
  const bot = new THREE.Mesh(new THREE.CircleGeometry(R - INS, SEG), faceMat(rv)); bot.rotation.x = Math.PI / 2; bot.position.y = -H / 2;
  for (const m of [side, bTop, bBot, top, bot]) { m.castShadow = true; m.receiveShadow = true; coin.add(m); }
  // start: random yaw, random side up
  coinQ.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rand(-0.5, 0.5));
  if (rnd(2)) coinQ.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI));
  coin.quaternion.copy(coinQ); coin.position.copy(coinP);
}

/* ---------------------------------------------------------------- audio */
const AU = {
  ctx: null, on: true,
  F: [4180, 6930, 9880, 12940], AMP: [1, .55, .33, .18],
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = this.ctx = new C();
    this.out = ctx.createGain(); this.out.gain.value = this.on ? 1 : 0;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -8; comp.ratio.value = 4;
    this.out.connect(comp).connect(ctx.destination);
    const len = Math.floor(ctx.sampleRate * 0.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4); }
    this.verb = ctx.createConvolver(); this.verb.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.2; this.verb.connect(wet).connect(this.out);
    this.bus = ctx.createGain(); this.bus.connect(this.out); this.bus.connect(this.verb);
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.noise = nb;
  },
  ring(t, gain, decay, dest = this.bus) {
    const ctx = this.ctx;
    this.F.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f * rand(.993, 1.007);
      const dec = decay * (1 - i * 0.17);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain * this.AMP[i], t + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
      o.connect(g).connect(dest); o.start(t); o.stop(t + dec + 0.05);
    });
  },
  hit(t, gain, f, q, dur, type = 'lowpass') {
    const ctx = this.ctx, s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = this.noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl).connect(g).connect(this.bus); s.start(t, rand(0, 0.8), dur + 0.05);
  },
  flick(spinHz) {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    this.hit(t, 0.55, 3200, 0.7, 0.014, 'highpass'); this.hit(t, 0.3, 650, 1, 0.025);
    const trem = this.ctx.createGain(); trem.gain.value = 0.55; trem.connect(this.bus);
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = spinHz; const dg = this.ctx.createGain(); dg.gain.value = 0.45;
    lfo.connect(dg).connect(trem.gain); lfo.start(t); lfo.stop(t + 2.2);
    this.ring(t + 0.004, 0.17, 1.9, trem);
  },
  impact(v) {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    this.hit(t, 0.8 * v, 950, 0.8, 0.04); this.hit(t, 0.3 * v, 2600, 0.8, 0.014);
    this.ring(t, 0.22 * v, 0.5);
  },
  tick(a) {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    this.ring(t, 0.035 + 0.09 * a, 0.08); this.hit(t, 0.1 * a + 0.02, 1500, 0.7, 0.012);
  },
  settle() {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    this.hit(t, 0.35, 850, 0.8, 0.05); this.ring(t, 0.1, 0.7);
  },
  setOn(v) { this.on = v; if (this.ctx) this.out.gain.setTargetAtTime(v ? 1 : 0, this.ctx.currentTime, 0.05); },
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------------------------------------------------------------- simulation */
const UP = new THREE.Vector3(0, 1, 0);
const ySup = a => R * Math.abs(Math.sin(a)) + (H / 2) * Math.abs(Math.cos(a));
const faceUp = q => UP.clone().applyQuaternion(q).y > 0 ? 'orel' : 'reshka';
let state = 'loading', S = null;
const qa = new THREE.Quaternion(), qb = new THREE.Quaternion(), tilt = new THREE.Vector3();

function toss() {
  if (state !== 'rest') return;
  AU.init();
  const result = rnd(2) ? 'orel' : 'reshka';
  const n = 14 + 2 * rnd(4) + (result === faceUp(coinQ) ? 0 : 1);
  const beta = rand(-0.45, 0.45) + (rnd(2) ? 0 : Math.PI);
  const axis = new THREE.Vector3(Math.cos(beta), 0, Math.sin(beta));
  const delta = rand(0.2, 0.42) * (rnd(2) ? 1 : -1);
  const apex = rand(5.6, 6.8), y0 = coinP.y, yL = ySup(delta);
  const vy = Math.sqrt(2 * G * (apex - y0));
  const T = (vy + Math.sqrt(vy * vy - 2 * G * (yL - y0))) / G;
  const target = new THREE.Vector3(rand(-1.1, 1.1), 0, rand(-0.7, 0.9));
  const vxz = new THREE.Vector3(target.x - coinP.x, 0, target.z - coinP.z).divideScalar(T + 0.3);
  const bounces = []; let yS = yL, dS = delta, tAcc = T;
  const d1 = -delta * rand(.35, .55), d2 = -d1 * rand(.3, .5);
  for (const [vb, dE] of [[rand(7, 9), d1], [rand(3, 4.2), d2]]) {
    const yE = ySup(dE), Tb = (vb + Math.sqrt(vb * vb - 2 * G * (yE - yS))) / G;
    bounces.push({ t0: tAcc, T: Tb, v: vb, yS, dS, dE }); tAcc += Tb; yS = yE; dS = dE;
  }
  S = { t0: performance.now() / 1000, Q0: coinQ.clone(), P0: coinP.clone(), axis, n, delta, vy, T, vxz, bounces, tB: tAcc,
        psiRate: rand(-1.6, 1.6), y0, result, bi: -1, landed: false };
  state = 'fly';
  const omega = (n * Math.PI + delta) / T;
  AU.flick(omega / Math.PI);
  buzz(12);
  $('res').classList.remove('on'); $('sub').style.opacity = 0; $('hint').classList.add('off');
}
const hs = t => t < S.T ? t : S.T + 0.3 * (t - S.T);
function orient(theta, psi) {
  qa.setFromAxisAngle(S.axis, theta); qb.setFromAxisAngle(UP, psi);
  return coinQ.copy(qb).multiply(qa).multiply(S.Q0);
}
function simulate(now, dt) {
  if (state !== 'fly' && state !== 'wobble') return;
  const t = now - S.t0;
  if (state === 'fly') {
    const psi = S.psiRate * hs(t);
    coinP.x = S.P0.x + S.vxz.x * hs(t); coinP.z = S.P0.z + S.vxz.z * hs(t);
    if (t < S.T) {
      const th = (S.n * Math.PI + S.delta) * t / S.T;
      orient(th, psi);
      coinP.y = S.y0 + S.vy * t - G * t * t / 2;
      if (t < 0.12) coinP.y = Math.max(coinP.y, ySup(th));
    } else if (t < S.tB) {
      if (!S.landed) { S.landed = true; AU.impact(1); buzz(25); }
      let bi = S.bounces.findIndex(b => t >= b.t0 && t < b.t0 + b.T);
      if (bi < 0) bi = S.bounces.length - 1;
      if (bi !== S.bi) { if (S.bi >= 0) { AU.impact(S.bounces[S.bi].v / 32 + 0.12); buzz(10); } S.bi = bi; }
      const b = S.bounces[bi], tau = Math.min(t - b.t0, b.T), u = tau / b.T;
      const e = u * u * (3 - 2 * u);
      orient(S.n * Math.PI + b.dS + (b.dE - b.dS) * e, psi);
      coinP.y = b.yS + b.v * tau - G * tau * tau / 2;
    } else {
      AU.impact(S.bounces[S.bounces.length - 1].v / 32 + 0.08);
      const psiE = S.psiRate * hs(S.tB);
      qa.setFromAxisAngle(S.axis, S.n * Math.PI); qb.setFromAxisAngle(UP, psiE);
      S.Qend = qb.clone().multiply(qa).multiply(S.Q0);
      const A2 = S.axis.clone().applyAxisAngle(UP, psiE), d2 = S.bounces[S.bounces.length - 1].dE;
      S.a0 = Math.abs(d2) + 0.04; S.phi = Math.atan2(A2.z, A2.x) + (d2 < 0 ? Math.PI : 0);
      S.Tw = rand(1.4, 2.1); S.om = rand(9, 12) * (rnd(2) ? 1 : -1); S.tw0 = t; S.tick = Math.floor(S.phi / (Math.PI / 2));
      state = 'wobble';
    }
  }
  if (state === 'wobble') {
    const u = (t - S.tw0) / S.Tw;
    if (u >= 1) {
      coinQ.copy(S.Qend); coinP.y = H / 2; state = 'rest';
      AU.settle(); buzz(30); setTimeout(showResult, 250);
    } else {
      const a = S.a0 * Math.pow(1 - u, 1.4);
      const rate = clamp(Math.abs(S.om) * Math.sqrt(S.a0 / Math.max(a, S.a0 * 0.02)), 0, 78) * Math.sign(S.om);
      S.phi += rate * dt;
      tilt.set(Math.cos(S.phi), 0, Math.sin(S.phi));
      coinQ.copy(qa.setFromAxisAngle(tilt, a)).multiply(S.Qend);
      coinP.y = ySup(a);

}

/* ---------------------------------------------------------------- result UI */
const stats = { orel: 0, reshka: 0, hist: [] };
try { Object.assign(stats, JSON.parse(localStorage.getItem('ed-coin') || '{}')); } catch (e) {}
const LINES = {
  orel: ['Эд, выпал орёл', 'Орёл. Вселенная сказала «да»', 'Орёл, Эдуард. Действуй'],
  reshka: ['Эд, выпала решка', 'Решка. Вселенная сказала «нет»', 'Решка, Эдуард. Подумай ещё'],
};
function renderStats() {
  $('so').textContent = stats.orel; $('sr').textContent = stats.reshka;
  $('hist').innerHTML = stats.hist.slice(-8).map(h => `<i class="${h === 'reshka' ? 'r' : ''}"></i>`).join('');
}
function showResult() {
  const f = faceUp(coinQ);
  stats[f]++; stats.hist.push(f); stats.hist = stats.hist.slice(-20);
  try { localStorage.setItem('ed-coin', JSON.stringify(stats)); } catch (e) {}
  $('res').textContent = f === 'orel' ? 'ОРЁЛ' : 'РЕШКА';
  $('sub').textContent = LINES[f][rnd(3)];
  $('res').classList.add('on'); $('sub').style.opacity = 1; $('hint').classList.remove('off');
  $('hint').textContent = 'Ещё раз? Нажми на монетку';
  renderStats();
}
renderStats();

/* ---------------------------------------------------------------- input */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const hitSphere = new THREE.Mesh(new THREE.SphereGeometry(1.5, 12, 8), new THREE.MeshBasicMaterial({ visible: false }));
scene.add(hitSphere);
addEventListener('pointerdown', e => {
  if (e.target.closest('a,button')) return;
  toss();
});
addEventListener('pointermove', e => {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  document.body.style.cursor = state === 'rest' && ray.intersectObject(hitSphere).length ? 'pointer' : 'default';
});
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); toss(); } });
$('snd').addEventListener('click', () => { AU.setOn(!AU.on); $('snd').textContent = AU.on ? '🔊' : '🔇'; });
document.addEventListener('visibilitychange', () => { if (AU.ctx) document.hidden ? AU.ctx.suspend() : AU.ctx.resume(); });

/* ---------------------------------------------------------------- loop */
const look = new THREE.Vector3(), camPos = new THREE.Vector3();
let last = performance.now() / 1000; let FREEZE = null;
function frame() {
  let now = performance.now() / 1000; const dt = Math.min(now - last, 0.05); last = now;
  if (FREEZE !== null && S) now = S.t0 + FREEZE;
  simulate(now, dt);
  hitSphere.position.copy(coinP);
  const cy = coinP.y - H / 2, bob = Math.sin(now * 0.5) * 0.04;
  camPos.set(camBase.x + coinP.x * 0.15 + Math.sin(now * 0.31) * 0.05, camBase.y + cy * 0.55 + bob, camBase.z + cy * 0.75 + coinP.z * 0.1);
  camera.position.lerp(camPos, Math.min(1, dt * 7));
  look.lerp(new THREE.Vector3(coinP.x * 0.5, cy * 0.8, coinP.z * 0.5), Math.min(1, dt * 9));
  camera.lookAt(look);
  key.target.position.set(coinP.x * 0.6, 0, coinP.z * 0.6);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
buildCoin().then(() => {
  camera.position.copy(camBase); camera.lookAt(0, 0, 0);
  renderer.compile(scene, camera);
  state = 'rest'; $('loading').classList.add('gone');
  requestAnimationFrame(frame);
});
window.__coin = { toss, state: () => state, faceUp: () => faceUp(coinQ), freeze: t => { FREEZE = t; } };
</script>
